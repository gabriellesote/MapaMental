        <p style="font-size:13px;line-height:1.65;color:var(--text-2);margin-top:6px;white-space:pre-wrap;text-wrap:pretty">${esc(p.desc||'')}</p>
      </div>
      ${editavel ? `<div style="display:flex;align-items:center;gap:4px;flex-shrink:0">
        <button class="pen" data-act="editPratica" data-id="${esc(p.id)}" title="Editar prática" style="opacity:1">${ico('pen',12)}</button>
        <button class="pen" data-act="delPratica" data-id="${esc(p.id)}" title="Excluir prática" style="opacity:1;color:var(--danger)">${ico('x',12)}</button>

/* Setores que efetivamente responderam alguma pergunta deste tópico. */
function setoresQueResponderam(t){
  const ids = [];
  (t.perguntas||[]).forEach(p=>(p.respostas||[]).forEach(r=>{
    if (r.setorId && !ids.includes(r.setorId)) ids.push(r.setorId);
  }));
  return ids;
}

function blocoSetoresEnv(t){
  const ids = setoresQueResponderam(t);
  if (!ids.length) return '<div class="empty" style="padding:26px;border-radius:16px;font-size:13px">Nenhum setor respondeu às perguntas deste tópico ainda.</div>';
  const total = p => (t.perguntas||[]).reduce((n,q)=>n + (q.respostas||[]).filter(r=>r.setorId===p).length, 0);
  return `<div style="display:flex;flex-direction:column;gap:11px">${ids.map(sid=>{
    const s = dados.setores.find(x=>x.id===sid) || { id:sid, nome:setorNome(sid) };
    const c = setorTile(sid);
    const open = !!ui.openSetEnv[sid];
    const fs = s.func || [];
    const nr = total(sid);
    return `<div class="q">
      <button class="qhead" data-act="toggleSetEnv" data-id="${esc(sid)}" style="align-items:center;padding:13px 15px">
        <span class="chevGiro ${open?'on':''}" style="display:inline-flex;color:var(--text-3)">${ico('chev',13,90)}</span>
        <span class="tile" style="width:30px;height:30px;border-radius:10px;background:${c.bg};color:${c.fg};font-size:12px;flex-shrink:0">${esc((s.nome||'?').charAt(0).toUpperCase())}</span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:13.5px;font-weight:700;letter-spacing:-.012em;color:var(--text)">${esc(s.nome)}</span>
          <span style="display:block;font-size:11.5px;color:var(--text-3);margin-top:2px">${nr} ${nr===1?'resposta':'respostas'} neste tópico · ${fs.length} ${fs.length===1?'pessoa':'pessoas'}</span>
        </span>
      </button>
      ${open ? `<div class="qbody" style="background:var(--surface)">
        <div>
          <div class="kicker" style="font-size:10px">Gestor responsável</div>
          <div style="font-size:13.5px;font-weight:600;color:var(--text);margin-top:5px">${esc(s.coord||'') || vazioTxt('Não informado.')}</div>
        </div>
        <div>
          <div class="kicker" style="font-size:10px">Funcionários</div>
          <div style="margin-top:7px">${fs.length
            ? `<div class="tags">${fs.map(x=>`<span class="gitem">${esc(x)}</span>`).join('')}</div>`
            : vazioTxt('Nenhum funcionário cadastrado.')}</div>
        </div>
        <div style="display:flex;justify-content:flex-end;padding-top:2px">
          <button class="mini" data-act="irSetorCompleto" data-id="${esc(sid)}">Ver ficha completa em Setores ${ico('chev',12)}</button>
        </div>
      </div>` : ''}
    </div>`;
  }).join('')}</div>`;
}

/* Visualização geral: os três contextos do tópico, cada um num toggle. */
function secGeral(k, rot, meta, corpo){
  const open = k in ui.openGeral ? !!ui.openGeral[k] : (k === 'desc');
  return `<div class="q">
    <button class="qhead" data-act="toggleGeral" data-sec="${k}" style="align-items:center;padding:15px 16px">
      <span class="chevGiro ${open?'on':''}" style="display:inline-flex;color:var(--text-3)">${ico('chev',13,90)}</span>
      <span style="flex:1;font-size:13.5px;font-weight:700;letter-spacing:-.012em;color:var(--text)">${rot}</span>
      ${meta ? `<span class="kicker" style="font-size:10px">${esc(meta)}</span>` : ''}
    </button>
    ${open ? `<div class="qbody" style="background:var(--surface)">${corpo}</div>` : ''}
  </div>`;
}

function blocoGeral(t){
  const nf = (t.fontes||[]).length;
  const nq = (t.perguntas||[]).length;
  const np = (t.praticas||[]).length;
  const info = `<p class="desc" style="font-size:14px">${esc(t.desc||'Sem descrição.')}</p>
    ${blocoFonte(t)}
    <div class="tags">${tagsHtml(t.setores)}</div>`;
  return `<div style="display:flex;flex-direction:column;gap:11px">
    ${secGeral('desc','Descrição e fonte', nf>1 ? nf+' fontes' : (nf || t.norm ? esc(t.norm||'1 fonte') : 'sem fonte'), info)}

/* Painel de leitura do tópico, usado no foco da guia Mapa: mostra tudo,
   sem editar nem excluir — essas ações continuam na guia Dimensões. */
function painelTopico(t){
  const d = dados.dimensoes.find(x=>x.id===t.dimId);
  const c = dimTile(t.dimId);
  const qs = blocoQAs(t);
  const aba = abaTopico();

  return `<article class="card" style="gap:0;padding:0;overflow:hidden">
    <div style="display:flex;align-items:flex-start;gap:14px;padding:22px 24px;border-bottom:1px solid var(--border)">
      <div class="tile" style="width:46px;height:46px;border-radius:14px;background:${c.bg};color:${c.fg};font-size:16px">${esc((t.nome||'?').charAt(0).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="kicker">Dimensão ${esc(t.dimId)} &middot; ${esc(d?d.nome:'')}</div>
        <h3 style="font-size:21px;font-weight:800;letter-spacing:-.025em;margin-top:5px">${esc(t.nome)}</h3>
      </div>
      ${t.norm ? `<span class="norm">${esc(t.norm)}</span>` : ''}
    </div>
    ${abasTopico(t)}
    ${aba === 'roteiro'
      ? `<div class="tabPane" style="padding:20px 24px 24px;display:flex;flex-direction:column;gap:11px">${qs}</div>`
      : aba === 'praticas'
      ? `<div class="tabPane" style="padding:20px 24px 24px">${blocoPraticas(t, false)}</div>`
      : aba === 'setores'
      ? `<div class="tabPane" style="padding:20px 24px 24px">${blocoSetoresEnv(t)}</div>`
      : aba === 'geral'
      ? `<div class="tabPane" style="padding:20px 24px 24px">${blocoGeral(t)}</div>`
      : `<div class="tabPane" style="padding:22px 24px 24px;display:flex;flex-direction:column;gap:17px">
          <p class="desc" style="font-size:14.5px">${esc(t.desc||'Sem descrição.')}</p>
          ${blocoFonte(t)}
          <div class="tags">${tagsHtml(t.setores)}</div>
        </div>`}
  </article>`;
}

/* ------------------------------------------------------------------- foco */
function renderFoco(){
  const cont = $('#foco');
  if (!cont) return;
  const f = ui.foco;
  if (!f){ cont.innerHTML = ''; return; }
  let card = '', rot = '', larga = '';
  if (f.tipo === 'topico'){
    const t = getTopico(f.id);
    if (!t){ ui.foco = null; cont.innerHTML = ''; return; }
    rot = `${ico('olho',13)} Tópico em foco <span class="autoSelo">somente leitura</span>`;
    larga = 'max-width:740px';
    card = painelTopico(t);
  } else if (f.tipo === 'setor'){
    const i = setorIdx(f.id), s = dados.setores[i];
    if (!s){ ui.foco = null; cont.innerHTML = ''; return; }
    rot = 'Setor em foco'; card = cardSetor(s, i, true);
  } else {
    const pr = listaProcessos().find(x=>x.respId===f.id);
    if (!pr){ ui.foco = null; cont.innerHTML = ''; return; }
    rot = 'Processo em foco';
    card = cardProcesso(pr, ui.grupoProc === 'setor' ? 'setor' : 'dim', true);
  }
  cont.innerHTML = `<div class="overlay foco" data-act="fecharFoco">
    <div class="focoBox" data-stop style="${larga}">
      <div class="focoBar">
        <span class="focoRot">${rot}</span>
        <button class="x" data-act="fecharFoco" title="Sair do foco (Esc)">${ico('x',13)}</button>
      </div>
      ${card}
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ modais */
/* Recria o HTML dos modais preservando a rolagem — sem isso, adicionar uma
   pergunta ou resposta joga a modal de volta ao topo e parece que ela fechou. */
let modaisAbertos = [];
function renderModais(){
  const cont = $('#modais');
  const antes = [...cont.querySelectorAll('.overlay')].map(o=>o.scrollTop);

  const parts = [], keys = [];
  if (ui.activeTopicId){ parts.push(modalTopico()); keys.push('topico'); }
  if (ui.topicForm)   { parts.push(modalTopicForm()); keys.push('topicForm'); }
  if (ui.setorForm)   { parts.push(modalSetorForm()); keys.push('setorForm'); }
  if (ui.cfg)         { parts.push(modalConfig()); keys.push('cfg'); }
  if (ui.dadosModal)  { parts.push(modalDados()); keys.push('dados'); }
  cont.innerHTML = parts.join('');

  // a animação de entrada só vale para modal que acabou de abrir
  cont.querySelectorAll('.overlay').forEach((o,i)=>{
    if (modaisAbertos.includes(keys[i])) o.classList.add('noanim');
    if (antes[i]) o.scrollTop = antes[i];
  });
  modaisAbertos = keys;
}

/* seta entre passos da trilha */
function setaPasso(){
  return '<span class="stepSep"><svg viewBox="0 0 48 12" fill="none" stroke="currentColor" stroke-width="1.6" '
    + 'stroke-linecap="round" stroke-linejoin="round" preserveAspectRatio="none" aria-hidden="true">'
    + '<path d="M0 6h42M38 2.5 42 6l-4 3.5"/></svg></span>';
}
/* trilha numerada: cada passo é clicável, o atual fica em destaque */
function trilha(passos, atual, acao){
  return '<div class="steps">' + passos.map((p,i)=>
    `<button class="step ${i===atual?'on':(i<atual?'done':'')}" data-act="${acao}" data-step="${i}">
        <span class="stepN">${String(i+1).padStart(2,'0')}</span>${esc(p)}
      </button>` + (i < passos.length-1 ? setaPasso() : '')
  ).join('') + '</div>';
}
/* rodapé: voltar/cancelar à esquerda, ação principal larga à direita */
function rodapePassos(cfg){
  const ultimo = cfg.passo >= cfg.total - 1;
  return `<div class="mfoot">
    <button class="ghost" data-act="${cfg.passo === 0 ? cfg.fechar : cfg.voltar}">${cfg.passo === 0 ? 'Cancelar' : 'Voltar'}</button>
    <button class="primary" data-act="${ultimo ? cfg.salvar : cfg.avancar}">${ultimo ? cfg.rotuloSalvar : 'Próximo passo'} 
      ${ultimo ? '' : ico('chev',14)}</button>
  </div>`;
}

  const f = ui.topicForm; if (!f) return;
  const v = sel => { const el = $(sel); return el ? el.value : null; };
  const n = v('#fTopNome'); if (n !== null) f.nome = n;

  const dm = v('#fTopDim');  if (dm !== null) f.dimId = dm;

function capturaSetorForm(){

  const n = v('#fSetNome');  if (n !== null) f.nome = n;

  const f = ui[chave]; if (!f) return;
  (chave === 'topicForm' ? capturaTopicForm : capturaSetorForm)();
  f.step = Math.max(0, Math.min(alvo, total - 1));

      ? `<p class="note" style="color:var(--warn)">O <span class="mono">dados.json</span> está conectado, mas o navegador exige um clique para reautorizar a gravação nesta sessão.</p>
         <div><button class="primary" data-act="reautorizar">Reautorizar gravação</button></div>`
      : fileHandle
      ? `<p class="note">Arquivo conectado — toda alteração é gravada no <span class="mono">dados.json</span>${fileSynced?' (em dia).':' — gravação pendente.'}</p>`
      : `<p class="note">As alterações estão salvas apenas <b>na memória do navegador</b>. Conecte o <span class="mono">dados.json</span> para gravar também em disco a cada mudança.</p>`;
    const bkHtml = bk.map((b,i)=>`<div style="display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <span style="font-size:12.5px;color:var(--text-2)">${new Date(b.em).toLocaleString('pt-BR')}</span>
        <button class="mini" data-act="restore" data-i="${i}">Restaurar</button>
      </div>`).join('') || '<div style="font-size:12.5px;color:var(--text-3)">Nenhum backup ainda.</div>';
    corpo = `<div class="fcard" style="gap:18px">
      ${est}
      <div class="tags">
        <button class="primary" data-act="conectar">Conectar dados.json</button>
        <button class="ghost" data-act="importar" style="background:var(--surface)">Importar JSON</button>
        <button class="ghost" data-act="criarArquivo" style="background:var(--surface)">Criar novo arquivo</button>
        <button class="ghost" data-act="baixar" style="background:var(--surface)">Baixar dados.json</button>
      </div>
      <div>
        <div class="kicker" style="margin-bottom:8px">Backups automáticos (últimos ${MAX_BACKUPS})</div>
        ${bkHtml}
      </div>
      <div>
        <div class="kicker" style="margin-bottom:8px">Memória do navegador</div>
        <span class="dica">Apaga a cópia local (localStorage) sem tocar no arquivo em disco.</span>
        <div style="margin-top:9px"><button class="ghost" data-act="limpar" style="background:var(--surface);color:var(--danger)">Apagar dados do navegador</button></div>
      </div>
    </div>`;
  } else if (tab === 'json'){
    const txt = c.json != null ? c.json : JSON.stringify(dados, null, 2);
    corpo = `<div class="fcard" style="gap:12px">
      <div>
        <label class="f" for="cfgJson">JSON completo</label>
        <span class="dica">Edite vários registros de uma vez e aplique tudo junto. O conteúdo é validado antes de substituir os dados.</span>
      </div>
      <textarea class="inp mono" id="cfgJson" spellcheck="false" style="min-height:340px;height:auto;padding:13px 14px;font-size:12.5px;line-height:1.6;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto">${esc(txt)}</textarea>
      ${c.jsonErr ? `<div class="note" style="color:var(--danger)">${esc(c.jsonErr)}</div>` : ''}
      <div class="tags">
        <button class="primary" data-act="cfgJsonAplicar">Aplicar alterações</button>
        <button class="ghost" data-act="cfgJsonFormatar" style="background:var(--surface)">Formatar</button>
        <button class="ghost" data-act="cfgJsonReverter" style="background:var(--surface)">Descartar edições</button>
      </div>
    </div>`;
  } else {
    const escopo = c.escopo || 'setores';
    const tudo = escopo === 'tudo';
    const modo = tudo ? 'todos' : (c.modo || 'todos');
    const itens = tudo ? [] : cfgItens(escopo);
    const sel = c.sel || {};
    const nsel = itens.filter(i=>sel[i.id]).length;
    const info = (CFG_ESC.find(x=>x.k===escopo)||{}).hint || '';
    const lista = tudo ? '' : (modo === 'alguns'
      ? `<div style="display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto;padding-right:2px">
          ${itens.map(i=>cfgLinhaSel(i, !!sel[i.id])).join('') || vazioTxt('Nada cadastrado neste escopo.')}
        </div>`
      : `<div class="note">Serão excluídos <b>${itens.length}</b> registros — tudo o que existe neste escopo.</div>`);

    const podeIr = tudo ? (c.ok1 && (c.palavra||'').trim().toUpperCase() === 'EXCLUIR TUDO')
                        : (c.ok1 && (modo === 'todos' ? itens.length : nsel));
    corpo = `<div class="fcard" style="gap:16px">
      <div>
        <div class="kicker" style="margin-bottom:9px">1. O que excluir</div>
        <div class="tags">${CFG_ESC.map(e=>`<button class="mini ${e.k==='tudo'?'danger':''}" data-act="cfgEscopo" data-k="${e.k}"
          style="${escopo===e.k?`border-color:var(--danger);color:var(--danger);background:var(--surface)`:''}">${e.rot}</button>`).join('')}</div>
        <span class="dica" style="display:block;margin-top:9px">${info}</span>
      </div>
      ${tudo ? '' : `<div>
        <div class="kicker" style="margin-bottom:9px">2. Quanto excluir</div>
        <div class="tags">
          <button class="mini" data-act="cfgModo" data-k="todos" style="${modo==='todos'?'border-color:var(--danger);color:var(--danger)':''}">Todos</button>
          <button class="mini" data-act="cfgModo" data-k="alguns" style="${modo==='alguns'?'border-color:var(--danger);color:var(--danger)':''}">Escolher alguns${nsel?` (${nsel})`:''}</button>
        </div>
        <div style="margin-top:11px">${lista}</div>
      </div>`}
      <div>
        <div class="kicker" style="margin-bottom:9px">${tudo?'2':'3'}. Confirmação dupla</div>
        ${cfgLinhaSel({ id:'__ok', rot:'Entendo que a exclusão é definitiva', meta:'Sem desfazer — só um backup pode recuperar.' }, !!c.ok1).replace('data-act="cfgSel" data-id="__ok"','data-act="cfgOk1"')}
        ${tudo ? `<div style="margin-top:11px">
          <label class="f" for="cfgPalavra">Digite <span class="mono">EXCLUIR TUDO</span> para liberar o botão</label>
          <input class="inp mono" id="cfgPalavra" value="${esc(c.palavra||'')}" placeholder="EXCLUIR TUDO" style="margin-top:8px">
        </div>` : ''}
      </div>
      <div style="display:flex;justify-content:flex-end;border-top:1px solid var(--border);padding-top:14px">
        <button class="primary" data-act="cfgExcluir" ${podeIr?'':'disabled'}
          style="background:var(--danger);border-color:var(--danger);${podeIr?'':'opacity:.45;pointer-events:none'}">
          ${tudo ? 'Excluir tudo definitivamente' : 'Excluir selecionados'}
        </button>
      </div>
    </div>`;
  }

  return `<div class="overlay" style="z-index:390" data-act="closeCfg">
    <div class="modal" data-stop>
      <div class="mhead big">
        <div class="mheadTop">
          <span class="mIco">${ico('engr',17)}</span>
          <h2 style="font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1">Configurações</h2>
          <button class="x" data-act="closeCfg" title="Fechar">${ico('x',13)}</button>
        </div>
        <p class="msub">Armazenamento, edição em massa do JSON e exclusão controlada de dados.</p>
      </div>
      ${abas}
      <div class="mbody tabPane">${corpo}</div>
    </div>
  </div>`;
}

/* Guarda o que est\u00e1 digitado nos campos das configura\u00e7\u00f5es antes de re-renderizar. */
function capturaCfg(){
  if (!ui.cfg) return;
  const ta = $('#cfgJson');   if (ta) ui.cfg.json = ta.value;
  const pw = $('#cfgPalavra'); if (pw) ui.cfg.palavra = pw.value;
}

function modalDados(){
  let bk = [];
  try { bk = JSON.parse(localStorage.getItem(LS_BACKUPS) || '[]'); } catch(e){}
  const bkHtml = bk.map((b,i)=>`<div style="display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:12.5px;color:var(--text-2)">${new Date(b.em).toLocaleString('pt-BR')}</span>
      <button class="mini" data-act="restore" data-i="${i}">Restaurar</button>
    </div>`).join('') || '<div style="font-size:12.5px;color:var(--text-3)">Nenhum backup ainda.</div>';

  const vazio = !dados.dimensoes.length && !dados.topicos.length && !dados.setores.length;

  let estado;
  if (vazio)
    estado = `<p class="note">Bem-vinda! Nada foi carregado ainda porque o navegador bloqueia a leitura automática de arquivos vizinhos quando o HTML é aberto por duplo clique.<br><br>
      Clique em <b>Conectar dados.json</b> e escolha o arquivo <span class="mono">dados.json</span> que está na mesma pasta deste HTML. Isso só é preciso uma vez: a partir daí tudo é salvo sozinho, no navegador e no próprio arquivo.</p>`;
  else if (fileHandle && filePerm !== 'granted')
    estado = `<p class="note" style="color:var(--warn)">O <span class="mono">dados.json</span> já foi conectado antes, mas o navegador exige um clique para reautorizar a gravação nesta sessão.</p>
      <button class="primary" data-act="reautorizar">Reautorizar gravação</button>`;
  else if (fileHandle)
    estado = `<p class="note">Arquivo conectado. Toda alteração é gravada automaticamente no <span class="mono">dados.json</span> escolhido${fileSynced?' (em dia).':' — gravação pendente.'}</p>`;
  else
    estado = `<p class="note">As alterações estão sendo salvas <b>no navegador (localStorage)</b>. Conecte o <span class="mono">dados.json</span> abaixo para que o arquivo também seja gravado sozinho a cada mudança.</p>`;

  const fsWarn = FS_OK ? '' :
    `<p class="note" style="color:var(--warn)">Este navegador (ou o modo de abertura do arquivo) não permite gravação direta em disco. Use <b>Baixar dados.json</b> para atualizar o arquivo manualmente, ou abra o HTML pelo Chrome/Edge.</p>`;

  return `<div class="overlay" style="z-index:400" ${vazio?'':'data-act="closeDados"'}>
    <div class="modal sm" data-stop>
      <div class="mhead big">
        <div class="mheadTop">
          <span class="mIco">${ico('caixa',17)}</span>
          <h2 style="font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1">${vazio?'Carregar dados':'Dados e backup'}</h2>
          ${vazio?'':'<button class="x" data-act="closeDados" title="Fechar">'+ico('x',13)+'</button>'}
        </div>
        <p class="msub">Conecte o arquivo <span class="mono">dados.json</span> para que tudo seja gravado sozinho a cada alteração.</p>
      </div>
      <div class="mbody">
       <div class="fcard" style="gap:18px">
        ${estado}${fsWarn}
        <div class="tags">
          <button class="primary" data-act="conectar">Conectar dados.json</button>
          <button class="ghost" data-act="importar" style="background:var(--surface)">Importar JSON (sem gravação automática)</button>
          ${vazio?'':`<button class="ghost" data-act="criarArquivo" style="background:var(--surface)">Criar novo arquivo</button>
          <button class="ghost" data-act="baixar" style="background:var(--surface)">Baixar dados.json</button>`}
        </div>
        ${vazio?'':`<div>
          <div class="kicker" style="margin-bottom:8px">Backups automáticos (últimos ${MAX_BACKUPS})</div>
          ${bkHtml}
        </div>
        <div>
          <div class="kicker" style="margin-bottom:8px">Zona de risco</div>
          <button class="ghost" data-act="limpar" style="background:var(--surface);color:var(--danger)">Apagar dados do navegador</button>
        </div>`}
       </div>
      </div>
    </div>
  </div>`;
}

/* ----------------------------------------------------------------- ações */
document.addEventListener('click', ev => {
  const stopEl = ev.target.closest('[data-stop]');
  const btn = ev.target.closest('[data-act]');
  if (!btn) return;
  // clique dentro do modal não deve fechar o overlay
  if (btn.hasAttribute('data-stop')) return;
  if (stopEl && btn === ev.target.closest('.overlay')) return;
  const act = btn.dataset.act, id = btn.dataset.id;

  const A = {
    goDim:  ()=>{ ui.page='dimensoes'; ui.openDimId=null; ui.activeTopicId=null; renderAll(); },
    goSet:  ()=>{ ui.page='setores'; ui.openDimId=null; ui.activeTopicId=null; renderAll(); },
    goTop:  ()=>{ ui.page='topicos'; ui.openDimId=null; ui.activeTopicId=null; renderAll(); },
    agruparTop:()=>{ ui.grupoTop = btn.dataset.modo; renderMain(); },
    sincronizar: async ()=>{
      if (!fileHandle){ toast('Nenhum dados.json conectado — conecte em Configurações'); return; }
      try {
        filePerm = await fileHandle.queryPermission({ mode:'readwrite' });
        if (filePerm !== 'granted') filePerm = await fileHandle.requestPermission({ mode:'readwrite' });
        if (filePerm !== 'granted'){ toast('Permissão de gravação negada'); renderStatus(); return; }
        const inc  = JSON.parse(await (await fileHandle.getFile()).text());
        const incT = Date.parse((inc && inc.atualizadoEm) || 0) || 0;
        const locT = Date.parse(dados.atualizadoEm || 0) || 0;
        if (incT > locT && Array.isArray(inc.dimensoes)){
          const ok = await pedeConfirma({ titulo:'O arquivo está mais novo',
            texto:'O dados.json em disco foi alterado depois desta aba. Carregar a versão do arquivo? O que estiver só aqui será substituído.',
            rotulo:'Carregar do arquivo' });
          if (ok){
            dados = normalize(inc);
            ui.openDimId=null; ui.activeTopicId=null; ui.foco=null;
            applyTheme(); saveLocal(); fileSynced = true; renderAll();
            toast('Dados carregados do dados.json'); return;
          }
        }
        clearTimeout(writeTimer);
        await writeToDisk();
        toast(fileSynced ? 'Sincronizado com o dados.json' : 'Não foi possível gravar o arquivo');
      } catch(e){ console.error(e); toast('Não foi possível sincronizar'); }
    },
    /* Salva nos DOIS destinos: memória do navegador e arquivo dados.json.
       O clique é um gesto do usuário, então dá para pedir o arquivo ou
       reautorizar a gravação aqui mesmo, sem mandar ninguém para outra tela. */
    salvarAgora: async ()=>{
      saveLocal();                 // navegador: sempre, e é instantâneo
      clearTimeout(writeTimer);    // a gravação agendada vira esta, imediata

      // arquivo conectado mas sem permissão nesta sessão: pede na hora
      if (fileHandle && filePerm !== 'granted'){
        try { filePerm = await fileHandle.requestPermission({ mode:'readwrite' }); } catch(e){}
      }

      // nenhum arquivo conectado ainda: escolhe o destino e passa a gravar sozinho
      if (!fileHandle){
        if (!FS_OK){
          renderStatus();
          toast('Salvo no navegador — este navegador não grava em arquivo');
          return;
        }
        try {
          const h = await window.showSaveFilePicker({
            suggestedName: 'dados.json',
            types:[{ description:'JSON', accept:{ 'application/json':['.json'] } }]
          });
          filePerm = await h.requestPermission({ mode:'readwrite' });
          if (filePerm !== 'granted'){
            renderStatus(); toast('Salvo no navegador — gravação no arquivo negada');
            return;
          }
          fileHandle = h;
          // lembrar o arquivo é desejável, mas não pode atrasar nem impedir a
          // gravação: se o IndexedDB falhar, ainda assim gravamos agora
          saveHandle(h).catch(()=>{});
        } catch(e){
          if (!e || e.name !== 'AbortError') console.error(e);
          renderStatus();
          toast('Salvo no navegador — nenhum arquivo escolhido');
          return;
        }
      }

      await writeToDisk();
      renderStatus();
      toast(fileSynced
        ? 'Salvo no navegador e no dados.json'
        : 'Salvo no navegador — falha ao gravar o arquivo');
    },
    goProc: ()=>{ ui.page='processos'; ui.openDimId=null; ui.activeTopicId=null; ui.editProc=null; renderAll(); },
    goMapa: ()=>{ ui.page='mapa'; ui.openDimId=null; ui.activeTopicId=null; ui.foco=null; renderAll(); },

    /* --- guia Mapa --- */
    mapaTog:()=>{ const k = btn.dataset.key; ui.mapaAberto[k] = !ui.mapaAberto[k]; renderMain(); },
    mapaTudo:()=>{
      if (btn.dataset.modo === 'fechar'){ ui.mapaAberto = {}; renderMain(); return; }
      const ab = {};
      dados.dimensoes.forEach(d=>{
        const sets = mapaSetores(d.id);
        if (!sets.length) return;
        ab['dim:'+d.id] = true;
        sets.forEach(({s})=>{ ab['set:'+d.id+'|'+s.id] = true; });
      });
      ui.mapaAberto = ab; renderMain();
    },

    /* --- foco: card isolado no centro, fundo escurecido --- */
    focarSetor:()=>{ ui.openSetores[id]=true; ui.editCampo=null; ui.foco={tipo:'setor',id}; renderMain(); },
    focarProc: ()=>{ ui.openProcs[id]=true;   ui.foco={tipo:'proc', id}; renderMain(); },
    verTopico: ()=>{ ui.foco={tipo:'topico', id}; renderMain(); },
    fecharFoco:()=>{ ui.foco=null; renderMain(); },
    confirmaSim:()=>fechaConfirma(true),
    confirmaNao:()=>fechaConfirma(false),

    /* --- guia Processos --- */
    toggleProc:()=>{ ui.openProcs[id] = !ui.openProcs[id]; ui.editProc = null; renderMain(); },
    agruparProc:()=>{ ui.grupoProc = btn.dataset.modo; ui.editProc = null; renderMain(); },
    salvaProc:()=>{
      const { campo } = ui.editProc;
      const e = extraProc(id);
      const v = $('#edProc').value;
      if (campo === 'titulo'){
        const t = v.trim();
        const pr = listaProcessos().find(x=>x.respId===id);
        // título igual à pergunta = sem personalização, volta a acompanhá-la
        e.titulo = (!t || t === pr.pergunta.texto) ? '' : t;
      } else {
        e.narrativa = v.trim();
      }
      ui.editProc = null;
      limpaProcVazios();
      persist(campo === 'titulo' ? 'Título atualizado' : 'Narrativa salva');
      renderMain();
    },
    cancelaProc:()=>{ ui.editProc = null; limpaProcVazios(); renderMain(); },
    toggleRec:()=>{
      const campo = btn.dataset.campo, val = btn.dataset.val;
      const e = extraProc(id);
      e[campo] = (e[campo]||[]).includes(val) ? e[campo].filter(x=>x!==val) : [...(e[campo]||[]), val];
      persist(); renderMain();
    },
    irSetorDeProc:()=>{ ui.page='setores'; ui.openSetores[id]=true; ui.editCampo=null; renderAll();
      document.querySelector(`[data-act="toggleSetor"][data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}); },
    tema:   ()=>{ dados.tema = dados.tema==='dark'?'light':'dark'; applyTheme(); persist(); renderAll(); },
    openDim:()=>{ ui.openDimId=id; renderMain(); },
    backGrid:()=>{ ui.openDimId=null; renderMain(); },
    openTopic:()=>{ ui.activeTopicId=id; ui.editQ=null; ui.editResp=null; ui.editPratica=null; ui.topicTab='geral'; renderModais(); },
    topicTab:()=>{ ui.topicTab = ABAS_TOPICO.includes(btn.dataset.tab) ? btn.dataset.tab : 'geral';
      ui.editPratica=null; renderModais(); renderFoco(); },
    toggleSetEnv:()=>{ ui.openSetEnv[id] = !ui.openSetEnv[id]; renderModais(); renderFoco(); },
    irSetorCompleto:()=>{
      ui.activeTopicId=null; ui.foco=null; ui.editQ=null; ui.editResp=null; ui.editPratica=null;
      ui.page='setores'; ui.openSetores[id]=true; ui.editCampo=null;
      renderAll();
      document.querySelector(`[data-act="toggleSetor"][data-id="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});
    },
    toggleGeral:()=>{ const k = btn.dataset.sec;
      const atual = k in ui.openGeral ? !!ui.openGeral[k] : (k === 'desc');
      ui.openGeral[k] = !atual; renderModais(); renderFoco(); },
    addPratica:()=>{
      const it = $('#novaPraticaTit'), ide = $('#novaPraticaDesc');
      const tit = (it.value||'').trim(), ds = (ide.value||'').trim();
      if (!tit){ toast('Informe o título da prática'); it.focus(); return; }
      const t = getTopico(ui.activeTopicId);
      if (!t.praticas) t.praticas = [];
      t.praticas.push({ id: uid('mk'), titulo: tit, desc: ds });
      persist('Prática adicionada'); renderModais(); focar('#novaPraticaTit');
    },
    editPratica:()=>{ ui.editPratica = id; ui.editQ = null; ui.editResp = null; renderModais(); focar('#edPratTit'); },
    salvaPratica:()=>{
      const tit = ($('#edPratTit').value||'').trim();
      if (!tit){ toast('O título não pode ficar vazio'); return; }
      const p = (getTopico(ui.activeTopicId).praticas||[]).find(x=>x.id===id);
      if (p){ p.titulo = tit; p.desc = ($('#edPratDesc').value||'').trim(); }
      ui.editPratica = null;
      persist('Prática atualizada'); renderModais();
    },
    delPratica:async ()=>{
      const ok = await pedeConfirma({ titulo:'Excluir esta prática?',
        texto:'O título e a descrição da prática de mercado serão removidos deste tópico.', rotulo:'Excluir' });
      if (!ok) return;
      const t = getTopico(ui.activeTopicId);
      t.praticas = (t.praticas||[]).filter(x=>x.id!==id);
      persist('Prática excluída'); renderModais();
    },
    closeTopic:()=>{ ui.activeTopicId=null; ui.editQ=null; ui.editResp=null; ui.editPratica=null; renderModais(); },

    toggleQ:()=>{ captureDrafts(); ui.openQ[id]=!ui.openQ[id]; renderModais(); restoreDrafts(); },
    saveResp:()=>{
      captureDrafts();
      const dr = ui.drafts[id]||{};
      const txt = (dr.texto||'').trim();
      if (!txt){ toast('Digite a resposta'); return; }
      const t = getTopico(ui.activeTopicId);
      const p = t.perguntas.find(x=>x.id===id);
      // id próprio já na criação: é a âncora do card de processo
      p.respostas.push({ id: uid('r'), setorId: dr.setor || (dados.setores[0]||{}).id, texto: txt });
      ui.drafts[id] = { setor: dr.setor, texto:'' };
      persist('Resposta salva'); renderModais(); restoreDrafts();
      // a modal continua aberta e no mesmo lugar: pronta para a próxima resposta
      focar(`[data-draft="texto"][data-id="${id}"]`);
    },
    delResp:async ()=>{
      const t = getTopico(ui.activeTopicId);
      const p = t.perguntas.find(x=>x.id===id);
      const r = p.respostas[Number(btn.dataset.i)];
      const ex = r && dados.processos.find(x=>x.respId===r.id);
      const temConteudo = ex && ((ex.narrativa||'').trim() || (ex.titulo||'').trim()
        || (ex.sist||[]).length || (ex.main||[]).length || (ex.tools||[]).length);
      const ok = await pedeConfirma({

// Enter em "nova pergunta"
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape'){
    // ESC cancela primeiro a edição em andamento, só depois fecha a modal
    if (ui.editQ || ui.editResp){ ui.editQ=null; ui.editResp=null; renderModais(); restoreDrafts(); return; }
    if (ui.editCampo){ ui.editCampo=null; renderMain(); return; }
    if (ui.editProc){ ui.editProc=null; limpaProcVazios(); renderMain(); return; }
    if (ui.confirma){ fechaConfirma(false); return; }
    if (ui.foco){ ui.foco=null; renderMain(); return; }
    // a tela inicial de carregamento não pode ser dispensada com ESC
    const vazio = !dados.dimensoes.length && !dados.topicos.length && !dados.setores.length;
    if (ui.dadosModal){ if (!vazio){ ui.dadosModal=false; renderModais(); } return; }
    if (ui.cfg){ ui.cfg=null; renderModais(); return; }
    if (ui.topicForm){ ui.topicForm=null; renderModais(); return; }
    if (ui.setorForm){ ui.setorForm=null; renderModais(); return; }
    if (ui.activeTopicId){ ui.activeTopicId=null; renderModais(); return; }
  }
  if (ev.key !== 'Enter') return;
  const alvo = ev.target;

  // Enter confirma; a modal segue aberta para o próximo item
  if (alvo.id === 'novaPergunta'){
    ev.preventDefault(); $('[data-act="addQ"]').click(); return;
  }
  if (alvo.dataset && alvo.dataset.draft === 'texto'){
    ev.preventDefault(); $(`[data-act="saveResp"][data-id="${alvo.dataset.id}"]`).click(); return;
  }
  if (alvo.id === 'edQTexto'){    ev.preventDefault(); $('[data-act="salvaQ"]').click(); return; }
  if (alvo.id === 'edRespTexto'){ ev.preventDefault(); $('[data-act="salvaResp"]').click(); return; }
  // nos textarea (listas, narrativa) o Enter serve para quebrar linha
  if (alvo.id === 'edCampo' && alvo.tagName === 'INPUT'){
    ev.preventDefault(); $('[data-act="salvaCampo"]').click(); return;
  }
  if (alvo.id === 'edProc' && alvo.tagName === 'INPUT'){
    ev.preventDefault(); $('[data-act="salvaProc"]').click();
  }
});

/* rascunhos de resposta: guardados fora do DOM para sobreviver ao re-render */
function captureDrafts(){
  document.querySelectorAll('[data-draft]').forEach(el=>{
    const id = el.dataset.id;
    ui.drafts[id] = ui.drafts[id] || {};
    ui.drafts[id][el.dataset.draft === 'setor' ? 'setor' : 'texto'] = el.value;
  });
}
function restoreDrafts(){
  document.querySelectorAll('[data-draft]').forEach(el=>{
    const d = ui.drafts[el.dataset.id]; if (!d) return;
    const v = el.dataset.draft === 'setor' ? d.setor : d.texto;
    if (v != null) el.value = v;
  });
}

/* --------------------------------------------- entrada de etiquetas (chips) */
document.addEventListener('keydown', ev=>{
  const el = ev.target;
  if (!el.dataset || el.dataset.taginput === undefined) return;
  const chave = el.dataset.taginput;
  if (ev.key === 'Enter' || ev.key === ','){
    ev.preventDefault(); ev.stopPropagation();
    addTags(chave, el.value); el.value = '';
    pintaTagBox(chave, true);
  } else if (ev.key === 'Backspace' && !el.value){
    const arr = ui.tags[chave] || [];
    if (arr.length){ ev.preventDefault(); arr.pop(); pintaTagBox(chave, true); }
  }
}, true);
document.addEventListener('input', ev=>{
  const el = ev.target;
  if (!el.dataset || el.dataset.taginput === undefined) return;
  if (!el.value.includes(',')) return;
  const chave  = el.dataset.taginput;
  const partes = el.value.split(',');
  const resto  = partes.pop();
  addTags(chave, partes.join(','));
  pintaTagBox(chave, true);
  const novo = document.querySelector('[data-taginput="'+chave+'"]');
  if (novo) novo.value = resto;
});
document.addEventListener('blur', ev=>{
  const el = ev.target;
  if (!el.dataset || el.dataset.taginput === undefined) return;
  if ((el.value||'').trim()){ addTags(el.dataset.taginput, el.value); el.value=''; pintaTagBox(el.dataset.taginput, false); }
}, true);
/* clicar em qualquer parte da caixa foca o campo de digitação */
document.addEventListener('mousedown', ev=>{
  const box = ev.target.closest && ev.target.closest('.tagbox');
  if (!box || ev.target.closest('[data-act]') || ev.target.classList.contains('taginp')) return;
  ev.preventDefault();
  const i = box.querySelector('.taginp'); if (i) i.focus();
});

/* o número de colunas depende da largura: refaz o arranjo ao redimensionar */
let resizeTimer = null;
window.addEventListener('resize', ()=>{
  if (ui.page === 'mapa'){ desenhaMapa(); return; }
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{ if (ui.page === 'setores' || ui.page === 'processos') renderMain(); }, 160);
});

boot();
</script>
</body>
</html>
