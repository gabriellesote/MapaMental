<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  /* claro: papel morno de baixa saturação — branco suave, sem estridência */
  --bg1:#f7f6f2; --bg2:#f0eee8;
  --surface:#fffefb; --surface-2:#f6f4ef; --surface-3:#eeebe4;
  --border:#e9e6df; --border-2:#dad6cd;
  --text:#1f211f; --text-2:#5e615d; --text-3:#96968e;
  --accent:#3860cc; --accent-t:#2a4fb2; --on-accent:#fff;
  --shadow:0 1px 2px rgba(64,54,42,.05),0 8px 24px rgba(64,54,42,.07);
  --shadow-lg:0 24px 70px rgba(64,54,42,.17);
  --danger:#c04a45; --ok:#3d8a67; --warn:#a97d1c;
  --ease:cubic-bezier(.22,.72,.24,1);
  --ring:rgba(56,96,204,.15);
}
html[data-theme="dark"]{
  --bg1:#0d0f14; --bg2:#151922;
  --surface:#171a21; --surface-2:#1e222b; --surface-3:#252a34;
  --border:#262b35; --border-2:#333944;
  --text:#f3f5f9; --text-2:#a6adbd; --text-3:#727a8b;
  --accent:#5b8cff; --accent-t:#7aa3ff; --on-accent:#0d0f14;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  --danger:#ff6b78; --ok:#3ecfa5; --warn:#e8b23c;
  --ring:rgba(91,140,255,.22);
}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg1);color:var(--text);-webkit-font-smoothing:antialiased}
input,textarea,select,button{font-family:inherit}
button{cursor:pointer}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.982)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes abre{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
@keyframes surge{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
::selection{background:var(--ring)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex-shrink:0}

#app{min-height:100vh;background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 100%);transition:background .35s ease,color .35s ease;padding:22px 26px 70px}
.wrap{max-width:1240px;margin:0 auto}

/* header */
header{position:sticky;top:14px;z-index:80;display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:13px 16px 13px 26px;max-width:1240px;margin:0 auto 38px;flex-wrap:wrap;transition:background .35s var(--ease),border-color .35s var(--ease)}
.brand{font-size:17px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
nav{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px}
.tab{height:34px;padding:0 17px;border-radius:17px;border:none;font-size:13px;font-weight:600;background:transparent;color:var(--text-2);transition:color .2s var(--ease),background .24s var(--ease)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface);color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.09)}
.spacer{margin-left:auto}
.hbtns{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 17px;border-radius:19px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:600;transition:border-color .22s var(--ease),color .22s var(--ease),background .22s var(--ease),transform .12s var(--ease)}
.ghost:hover{border-color:var(--accent);color:var(--text)}
.ghost:active,.primary:active,.iconBtn:active{transform:translateY(1px)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 21px;border-radius:19px;border:none;background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:background .22s var(--ease),box-shadow .22s var(--ease),transform .12s var(--ease)}
.primary:hover{background:var(--accent-t);box-shadow:0 4px 14px var(--ring)}
/* alternador de tema: sol e lua, no canto direito do cabeçalho */
.iconBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;transition:color .22s var(--ease),border-color .22s var(--ease),background .22s var(--ease),transform .12s var(--ease)}
.iconBtn:hover{color:var(--text);border-color:var(--accent);background:var(--surface-3)}
.iconBtn svg{animation:girar .34s var(--ease)}
@keyframes girar{from{opacity:0;transform:rotate(-70deg) scale(.7)}to{opacity:1;transform:none}}
.knob{width:26px;height:26px;border-radius:50%;background:var(--accent);transition:all .3s ease;display:inline-block;vertical-align:middle}
html[data-theme="dark"] .knob{box-shadow:inset -7px -3px 0 0 var(--surface-2)}
html[data-theme="light"] .knob{box-shadow:0 0 0 3px var(--ring)}

/* status pill */
.pill{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-3);flex-shrink:0}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--warn)}
.dot.busy{background:var(--accent);animation:fadeIn .6s ease-in-out infinite alternate}

/* cards */
h1{font-size:26px;font-weight:800;letter-spacing:-.03em}
.sub{font-size:14px;color:var(--text-2);margin-top:6px;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
/* cada card tem a altura do próprio conteúdo: expandir um não estica os vizinhos */
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;transition:transform .26s var(--ease),box-shadow .26s var(--ease),border-color .26s var(--ease);text-align:left;color:inherit;font:inherit;width:100%}
.card.click{cursor:pointer}
.card.click:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--border-2)}
.card.click:active{transform:translateY(-1px)}
.tile{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;letter-spacing:.02em;flex-shrink:0}
.chev{width:28px;height:28px;border-radius:50%;background:var(--surface-2);color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease)}
.chev:hover{color:var(--text);background:var(--surface-3)}
.card.click:hover .chev{transform:translateX(2px);color:var(--text-2)}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.clamp{font-size:13px;line-height:1.55;color:var(--text-2);margin-top:8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:center;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-2);transition:background .22s var(--ease)}
.card.click:hover .foot{background:var(--surface-3)}
.tag{font-size:11px;font-weight:600;padding:4px 11px;border-radius:20px;white-space:nowrap;line-height:1.35}
.tags{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#chipsRel,#chipsSetores{gap:9px;padding:3px 0 1px}
.norm{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3)}
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}
.empty{grid-column:1/-1;padding:46px;text-align:center;border:1px dashed var(--border-2);border-radius:20px;color:var(--text-3);font-size:13.5px}
.gitem{font-size:11.5px;font-weight:500;padding:5px 11px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);transition:border-color .2s var(--ease),color .2s var(--ease)}
.tag{transition:filter .2s var(--ease)}

/* setores expansíveis */
.setorHead{display:flex;align-items:center;gap:13px;cursor:pointer;width:100%;background:none;border:none;text-align:left;color:inherit}
.chevGiro{display:flex;transition:transform .28s var(--ease)}
.chevGiro.on{transform:rotate(-180deg)}
.secs{display:flex;flex-direction:column;gap:2px;margin-top:18px;border-top:1px solid var(--border);padding-top:6px;animation:abre .3s var(--ease)}
.sec{padding:13px 0;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.secHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;min-height:24px}
.pen{width:24px;height:24px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity .18s var(--ease),color .18s var(--ease),background .18s var(--ease)}
.sec:hover .pen,.pen:focus{opacity:1}
.pen:hover{color:var(--text);background:var(--surface-3)}
.autoSelo{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 9px;white-space:nowrap}
button.gitem:hover,button.tag:hover{filter:brightness(1.08);cursor:pointer}

/* foco: o card vai para o centro e o resto da tela escurece */
.overlay.foco{background:rgba(4,6,10,.6);backdrop-filter:blur(9px) saturate(120%);z-index:250;align-items:center;padding:4vh 20px}
.focoBox{width:100%;max-width:660px;margin:auto;display:flex;flex-direction:column;gap:12px;animation:popIn .28s var(--ease)}
.focoBar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.focoRot{display:flex;align-items:center;gap:9px;font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.66)}
.focoRot .autoSelo{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.66)}
.focoBox .card,.focoBox .procCard{box-shadow:var(--shadow-lg)}
.focoBox .x{background:rgba(255,255,255,.14);color:#fff}

/* guia Mapa */
.arvore{display:flex;flex-direction:column;gap:22px}
.mapaWrap{position:relative}
.mapaSvg{position:absolute;left:0;top:0;pointer-events:none}
.ramo{display:flex;align-items:center}
.noLinha{display:flex;align-items:center;flex-shrink:0}
.filhos{display:flex;flex-direction:column;gap:10px;padding-left:56px}
.no{display:inline-flex;align-items:baseline;gap:9px;padding:13px 17px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border);font-size:14.5px;font-weight:600;color:var(--text);text-align:left;line-height:1.3;max-width:360px;transition:border-color .22s var(--ease),background .22s var(--ease),transform .22s var(--ease),box-shadow .22s var(--ease)}
.no:hover{border-color:var(--border-2);background:var(--surface-3);transform:translateY(-1px);box-shadow:var(--shadow)}
.no.raiz{font-weight:700;font-size:15px}
.no.topico{background:var(--surface);font-weight:500;font-size:13.5px}
.no.topico.dup{box-shadow:inset 3px 0 0 0 var(--warn)}
.no.topico.dup:hover{box-shadow:inset 3px 0 0 0 var(--warn),var(--shadow)}
.dupSelo svg{opacity:.9}
.no small{font-size:11.5px;font-weight:500;color:var(--text-3);white-space:nowrap}
.noBtn{width:24px;height:24px;flex-shrink:0;margin-left:11px;border-radius:50%;border:1px solid var(--border-2);background:var(--surface-3);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;position:relative;z-index:2;transition:color .2s var(--ease),border-color .2s var(--ease),transform .3s var(--ease)}
.noBtn:hover{color:var(--text);border-color:var(--accent)}
.noBtn.on{transform:rotate(180deg)}
.filhos>.ramo{animation:surge .3s var(--ease) both}

/* entrada de etiquetas: vírgula ou Enter cria o chip */
.tagbox{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:40px;padding:7px 9px;border-radius:12px;border:1px solid var(--border-2);background:var(--surface-2);cursor:text;transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.tagchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 5px 0 11px;border-radius:14px;background:var(--surface);border:1px solid var(--border-2);color:var(--text);font-size:12.5px;font-weight:600;animation:surge .2s var(--ease)}
.tagx{width:19px;height:19px;border-radius:50%;border:none;background:transparent;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;transition:color .18s var(--ease),background .18s var(--ease)}
.tagx:hover{color:var(--danger);background:var(--surface-3)}
.taginp{flex:1;min-width:130px;height:26px;border:none;background:transparent;color:var(--text);font-size:13px;font-weight:500;outline:none}
.taginp::placeholder{color:var(--text-3);font-weight:400}
.dica{font-size:11.5px;font-weight:500;color:var(--text-3)}

/* colunas independentes: expandir um card não desloca nem estica os vizinhos */
.mas{display:flex;align-items:flex-start}
.masCol{flex:1;min-width:0;display:flex;flex-direction:column}

/* tópico presente em mais de um setor */
.dupSelo{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border-2);color:var(--warn);font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.02)}
.tip{position:relative}
.tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 9px);transform:translate(-50%,5px);background:var(--text);color:var(--surface);font-size:11.5px;font-weight:600;letter-spacing:0;text-transform:none;padding:7px 11px;border-radius:9px;white-space:nowrap;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .18s var(--ease),transform .18s var(--ease);z-index:70}
.tip:hover::after{opacity:1;transform:translate(-50%,0)}

/* fonte oficial do normativo: plaqueta em destaque no cabeçalho do tópico */
.fonte{display:flex;flex-direction:column;gap:9px;padding:12px 15px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);box-shadow:inset 3px 0 0 0 var(--accent)}
.fonteTopo{display:flex;align-items:center;gap:10px}
.fonteCod{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;font-weight:700;letter-spacing:.05em;padding:6px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border-2);color:var(--text);white-space:nowrap;flex-shrink:0}
.fonteLista{display:flex;flex-direction:column}
.fonteRow{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-bottom:1px dashed var(--border-2)}
.fonteRow:first-child{padding-top:2px}
.fonteRow:last-child{border-bottom:none;padding-bottom:2px}
.fonteTit{font-size:12.5px;font-weight:600;color:var(--text-2);line-height:1.45}
.fonteLinha{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2)}
.fonteItem{display:inline-flex;align-items:baseline;gap:5px;font-weight:700;color:var(--text)}
.fonteRot{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.row3{display:grid;grid-template-columns:1fr 1fr 2.2fr;gap:10px}
.fonteForm{display:flex;align-items:flex-end;gap:10px}
.fonteForm .row3{flex:1;min-width:0}
/* diálogo de confirmação — substitui o alerta do navegador */
.confBox{width:100%;max-width:420px;margin:auto;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:26px;display:flex;flex-direction:column;gap:14px;animation:popIn .26s var(--ease)}
.confIco{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border-2);color:var(--text-2);flex-shrink:0}
.confIco.perigo{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 30%,transparent);background:color-mix(in oklab,var(--danger) 8%,var(--surface-2))}
.confTit{font-size:17px;font-weight:800;letter-spacing:-.02em;color:var(--text);line-height:1.3}
.confTxt{font-size:13.5px;line-height:1.65;color:var(--text-2);text-wrap:pretty}
.confBtns{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}
.danger{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 19px;border-radius:19px;border:none;background:var(--danger);color:#fff;font-size:13px;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:filter .22s var(--ease),transform .12s var(--ease)}
.danger:hover{filter:brightness(1.07)}
.danger:active{transform:translateY(1px)}

/* descrição do tópico: o texto principal da leitura */
.desc{font-size:15px;font-weight:500;line-height:1.75;color:var(--text);text-wrap:pretty}
.mapaVazio .no{opacity:.42}

/* guia Processos — agrupamento discreto */
.grupo{margin:0 0 30px}
.grupoHead{display:flex;align-items:baseline;gap:12px;padding:0 2px 9px;border-bottom:1px solid var(--border);margin-bottom:16px}
.grupoPonto{width:7px;height:7px;border-radius:50%;flex-shrink:0;align-self:center}
.grupoNome{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.grupoQtd{margin-left:auto;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* card de processo: mais leve que os demais, sem sombra e sem tile */
.procCard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .24s var(--ease),box-shadow .24s var(--ease)}
.procCard:hover{border-color:var(--border-2);box-shadow:var(--shadow)}
.procCard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--barra)}
.procHead{display:flex;align-items:flex-start;gap:12px;width:100%;background:none;border:none;text-align:left;color:inherit;cursor:pointer;padding:15px 16px 15px 20px}
.procTit{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35;color:var(--text)}
.procMeta{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-top:5px;font-size:11.5px;color:var(--text-3)}
.procMeta b{font-weight:600;color:var(--text-2)}
.procSep{opacity:.5}
.procFlag{font-size:11px;color:var(--text-3)}
.procFlag.tem{color:var(--ok)}
.procCard .secs{margin:0 16px 14px 19px;padding-top:2px;border-top:1px solid var(--border)}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border-2);border-radius:19px;padding:3px;gap:2px}
.segbtn{height:30px;padding:0 14px;border-radius:16px;border:none;background:transparent;color:var(--text-3);font-size:12px;font-weight:600;transition:background .22s var(--ease),color .22s var(--ease)}
.segbtn:hover{color:var(--text-2)}
.segbtn.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.origemLinha{display:flex;gap:10px;align-items:baseline;font-size:12.5px;line-height:1.55;color:var(--text-2);padding:3px 0}
.origemRot{flex-shrink:0;width:64px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}

/* modals */
.overlay{position:fixed;inset:0;background:rgba(8,10,14,.52);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 20px;overflow-y:auto;animation:fadeIn .22s var(--ease)}
.modal{width:100%;max-width:740px;background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-lg);margin:auto;animation:popIn .26s var(--ease)}
.modal.sm{max-width:620px}
.mhead{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px}
.mfoot{padding:16px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.x{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface-2);color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .2s var(--ease),background .2s var(--ease)}
.x:hover{color:var(--text);background:var(--surface-3)}
.mini{height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--border-2);background:var(--surface);color:var(--text-2);font-size:12px;font-weight:600}

label.f,.f{display:flex;flex-direction:column;gap:8px;font-size:12px;font-weight:600;color:var(--text-2)}

<body>

<!-- ===== ESQUELETO: todo conteúdo vem de dados.json ===== -->
<div id="app">
  <header>
    <div class="brand">Mapa de Processos</div>
    <nav>
      <button class="tab" data-act="goDim">Dimensões</button>
      <button class="tab" data-act="goSet">Setores</button>
      <button class="tab" data-act="goProc">Processos</button>
      <button class="tab" data-act="goMapa">Mapa</button>
    </nav>
    <div class="spacer"></div>
    <div class="hbtns">
      <button class="pill" data-act="dados" title="Gerenciar armazenamento">
        <span class="dot" id="statusDot"></span><span id="statusText">…</span>
      </button>
      <button class="primary" data-act="novoTopico">Novo tópico</button>
      <button class="iconBtn" id="temaBtn" data-act="tema" aria-label="Alternar tema"></button>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<div id="modais"></div>
<div id="foco"></div>
<div id="confirma"></div>
<div id="toast" class="hide"></div>
<input type="file" id="fileInput" accept="application/json,.json" class="hide">

<script>
"use strict";
/* =========================================================================
   Mapa de Processos — armazenamento local automático
   - localStorage: gravado a cada alteração (sempre, instantâneo)
   - dados.json:   gravado direto no disco via File System Access API
   - backups:      últimas 10 versões guardadas no localStorage
   Nenhuma API, backend ou banco de dados.
   ========================================================================= */

const LS_DADOS   = 'mapaProcessos.dados.v1';
const LS_BACKUPS = 'mapaProcessos.backups.v1';
const IDB_NAME   = 'mapaProcessos';
const MAX_BACKUPS = 10;
const HUES = [258,155,62,300,350,205,130,25];

let dados = null;                 // conteúdo do dados.json em memória
let fileHandle = null;            // FileSystemFileHandle do dados.json
let filePerm  = null;             // 'granted' = pode gravar | 'prompt' = precisa reautorizar
let fileSynced = false;           // true = disco em dia com a memória
let writeTimer = null;
let toastTimer = null;

const ui = {
  page: 'dimensoes',
  openDimId: null,
  activeTopicId: null,
  openQ: {},        // { perguntaId: true }
  drafts: {},       // { perguntaId: {setor, texto} }
  topicForm: null,
  setorForm: null,
  dadosModal: false,
  openSetores: {},  // { setorId: true } — cards de setor expandidos
  editCampo: null,  // { setorId, campo } — edição inline de um atributo do setor
  openProcs: {},    // { respId: true } — cards de processo expandidos
  editProc: null,   // { respId, campo } — edição inline de um campo do processo
  filtroProc: '',
  grupoProc: 'dim', // eixo de agrupamento da guia Processos: 'dim' | 'setor'
  editQ: null,      // perguntaId em edição
  editResp: null,   // { qid, i } — resposta em edição
  foco: null,       // { tipo:'setor'|'proc', id } — card isolado no centro da tela
  mapaAberto: {},   // { 'dim:I': true, 'set:I|ti': true } — ramos abertos do mapa
  tags: {},         // { chave: ['item', …] } — conteúdo das entradas de etiquetas
  confirma: null    // diálogo de confirmação em aberto
};

const FS_OK = typeof window.showOpenFilePicker === 'function';

/* ---------------------------------------------------------------- utils */
const $  = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const lines = v => (v||'').split('\n').map(x=>x.trim()).filter(Boolean);

function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.add('hide'), 2400);
}

function tile(hue){
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  return dark
    ? { bg:`oklch(0.30 0.055 ${hue})`, fg:`oklch(0.84 0.10 ${hue})` }
    : { bg:`oklch(0.955 0.030 ${hue})`, fg:`oklch(0.47 0.095 ${hue})` };
}
const setorIdx  = id => dados.setores.findIndex(s=>s.id===id);
const setorTile = id => tile(HUES[(Math.max(0,setorIdx(id))) % HUES.length]);
const setorNome = id => (dados.setores.find(s=>s.id===id)||{}).nome || id;
const dimIdx    = id => dados.dimensoes.findIndex(d=>d.id===id);
const dimTile   = id => tile(HUES[Math.max(0,dimIdx(id)) % HUES.length]);
const getTopico = id => dados.topicos.find(t=>t.id===id);

/* Relacionamento AUTOMÁTICO: o setor é ligado a um tópico no formulário do tópico;
   daí derivam-se os tópicos do setor e, pelo dimId de cada um, as dimensões. */
const topicosDoSetor = id => dados.topicos.filter(t=>(t.setores||[]).includes(id));

/* Cada resposta É um processo. A lista abaixo é derivada — nunca digitada —
   e os campos preenchidos pelo usuário ficam em dados.processos, por respId. */
function listaProcessos(){
  const out = [];
  dados.topicos.forEach(t=>{
    const dim = dados.dimensoes.find(d=>d.id===t.dimId);
    (t.perguntas||[]).forEach(p=>{
      (p.respostas||[]).forEach(r=>{
        out.push({
          respId: r.id, topico: t, pergunta: p, resposta: r, dim,
          setorId: r.setorId,
          extra: dados.processos.find(x=>x.respId===r.id) || null
        });
      });
    });
  });
  return out;
}
/* Cria o registro de extras sob demanda, para não inchar o JSON com cards vazios. */
function extraProc(respId){
  let e = dados.processos.find(x=>x.respId===respId);
  if (!e){ e = { respId, titulo:'', narrativa:'', sist:[], main:[], tools:[] }; dados.processos.push(e); }
  return e;
}
const tituloProc = pr => (pr.extra && pr.extra.titulo) || pr.pergunta.texto;

/* Descarta registros sem nenhum conteúdo e os órfãos (resposta já excluída). */
function limpaProcVazios(){
  const vivos = new Set(listaProcessos().map(p=>p.respId));
  dados.processos = dados.processos.filter(e=>
    vivos.has(e.respId) &&
    ((e.titulo||'').trim() || (e.narrativa||'').trim() ||
     (e.sist||[]).length || (e.main||[]).length || (e.tools||[]).length)
  );
}

/* Opções de sistemas/mainframe/ferramentas: a união do que os setores declaram. */
function opcoesRecurso(campo){
  return [...new Set(dados.setores.flatMap(s=>s[campo]||[]))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}

/* "Relacionado" vale nos dois sentidos: espelha o vínculo no outro setor. */
function sincronizaRel(id, rel){
  dados.setores.forEach(s=>{
    if (s.id === id) return;
    const tem  = (s.rel||[]).includes(id);
    const deve = rel.includes(s.id);
    if (deve && !tem) s.rel = [...(s.rel||[]), id];
    else if (!deve && tem) s.rel = s.rel.filter(x=>x!==id);
  });
}
function dimensoesDoSetor(id){
  const ids = [...new Set(topicosDoSetor(id).map(t=>t.dimId))];
  return dados.dimensoes.filter(d=>ids.includes(d.id));
}

function tagsHtml(ids){
  return (ids||[]).map(id=>{
    const c = setorTile(id);
    return `<span class="tag" style="background:${c.bg};color:${c.fg}">${esc(setorNome(id))}</span>`;
  }).join('');
}

/* ------------------------------------------------- entrada de etiquetas */
/* Um campo de lista = chips. Vírgula ou Enter cria; Backspace apaga o último. */
function tagBox(chave, ph){
  const arr = ui.tags[chave] || [];
  return '<div class="tagbox" data-tagbox="'+esc(chave)+'">'
    + arr.map((v,i)=>'<span class="tagchip">'+esc(v)
        +'<button class="tagx" data-act="tagDel" data-key="'+esc(chave)+'" data-i="'+i+'" title="Remover">'+ico('x',9)+'</button></span>').join('')
    + '<input class="taginp" data-taginput="'+esc(chave)+'" placeholder="'+esc(ph||'Digite e separe por vírgula')+'"></div>';
}
function pintaTagBox(chave, foco){
  const box = document.querySelector('[data-tagbox="'+chave+'"]');
  if (!box) return;
  const inp = box.querySelector('.taginp');
  const ph  = inp ? inp.placeholder : '';
  box.outerHTML = tagBox(chave, ph);
  if (foco){ const novo = document.querySelector('[data-taginput="'+chave+'"]'); if (novo) novo.focus(); }
}
function addTags(chave, txt){
  const arr = ui.tags[chave] || (ui.tags[chave] = []);
  let mudou = false;
  String(txt||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(v=>{
    if (!arr.some(x=>x.toLowerCase()===v.toLowerCase())){ arr.push(v); mudou = true; }
  });
  return mudou;
}
/* o que ficou digitado sem vírgula também conta no momento de salvar */
function commitPendentes(){
  document.querySelectorAll('.taginp').forEach(el=>{
    if ((el.value||'').trim()){ addTags(el.dataset.taginput, el.value); el.value = ''; }
  });
}
const tagsDe = chave => [...(ui.tags[chave] || [])];

/* --------------------------------------------------- colunas independentes */
function colunasMas(min){
  const l = ($('#main') || {}).clientWidth || 1200;
  return Math.max(1, Math.min(4, Math.floor((l + 18) / ((min||300) + 18))));
}
/* Distribui os cards em colunas (1,2 na primeira faixa; 3,4 na seguinte).
   Cada coluna cresce sozinha: abrir um card não empurra nem estica os outros. */
function masonry(itens, min, gap){
  if (!itens.length) return '';
  const n = colunasMas(min);
  const g = gap || 18;
  const cols = Array.from({length:n}, ()=>[]);
  itens.forEach((html,i)=>cols[i % n].push(html));
  return '<div class="mas" data-cols="'+n+'" style="gap:'+g+'px">'
    + cols.map(c=>'<div class="masCol" style="gap:'+g+'px">'+c.join('')+'</div>').join('')
    + '</div>';
}
/* Depois do desenho, mede a altura real de cada card e realoca: o próximo card
   vai sempre para a coluna mais curta. Assim, ao expandir um card, o de baixo
   sobe para a coluna vizinha em vez de ser empurrado para longe. */
function equilibraMas(){
  document.querySelectorAll('.mas').forEach(mas=>{
    const cols = [...mas.children];
    const n = cols.length;
    if (n < 2) return;
    const g = parseFloat(mas.style.gap) || 18;
    // a marcação inicial é round-robin: coluna c, posição p => card p*n + c
    const itens = [];
    cols.forEach((col,c)=>[...col.children].forEach((el,p)=>{ itens[p*n + c] = el; }));
    const lista = itens.filter(Boolean);
    const alturas = lista.map(el=>el.getBoundingClientRect().height);
    const acum = new Array(n).fill(0);
    lista.forEach((el,i)=>{
      let k = 0;
      for (let j=1; j<n; j++) if (acum[j] < acum[k] - 0.5) k = j;
      acum[k] += alturas[i] + g;
      cols[k].appendChild(el);
    });
  });
}

/* ------------------------------------------------- diálogo de confirmação */
/* Nada de confirm() do navegador: o aviso é uma modal do próprio site. */
function pedeConfirma(op){
  return new Promise(res=>{
    ui.confirma = {
      titulo: op.titulo || 'Confirmar',
      texto:  op.texto  || '',
      rotulo: op.rotulo || 'Confirmar',
      perigo: op.perigo !== false,
      resolve: res
    };
    renderConfirma();
    setTimeout(()=>{ const b = $('#confirmaOk'); if (b) b.focus(); }, 30);
  });
}
function fechaConfirma(ok){
  const c = ui.confirma;
  ui.confirma = null;
  renderConfirma();
  if (c) c.resolve(ok);
}
function renderConfirma(){
  const cont = $('#confirma');
  if (!cont) return;
  const c = ui.confirma;
  if (!c){ cont.innerHTML = ''; return; }
  cont.innerHTML = `<div class="overlay" style="z-index:500;align-items:center" data-act="confirmaNao">
    <div class="confBox" data-stop>
      <div style="display:flex;align-items:flex-start;gap:14px">
        <span class="confIco ${c.perigo?'perigo':''}">${ico(c.perigo?'alerta':'olho',18)}</span>
        <div style="display:flex;flex-direction:column;gap:7px;min-width:0">
          <div class="confTit">${esc(c.titulo)}</div>
          ${c.texto ? `<div class="confTxt">${esc(c.texto)}</div>` : ''}
        </div>
      </div>
      <div class="confBtns">
        <button class="ghost" data-act="confirmaNao">Cancelar</button>
        <button class="${c.perigo?'danger':'primary'}" id="confirmaOk" data-act="confirmaSim">${c.perigo?ico('lixo',13):''}${esc(c.rotulo)}</button>
      </div>
    </div>
  </div>`;
}

/* ------------------------------------------------------- IndexedDB (handle) */
function idb(mode, fn){
  return new Promise((res, rej)=>{
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onerror = () => rej(req.error);
    req.onsuccess = () => {
      const db = req.result;
      const tx = db.transaction('kv', mode);
      const r  = fn(tx.objectStore('kv'));
      tx.oncomplete = () => { db.close(); res(r && r.result); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    };
  });
}
const saveHandle = h => idb('readwrite', st => st.put(h, 'dadosFile')).catch(()=>{});
const loadHandle = () => idb('readonly',  st => st.get('dadosFile')).catch(()=>null);
const dropHandle = () => idb('readwrite', st => st.delete('dadosFile')).catch(()=>{});

/* ------------------------------------------------------------ persistência */
function saveLocal(){
  dados.atualizadoEm = new Date().toISOString();
  const json = JSON.stringify(dados);
  try {
    localStorage.setItem(LS_DADOS, json);
  } catch(e){
    // cota estourada: os backups são descartáveis, os dados atuais não
    try {
      localStorage.removeItem(LS_BACKUPS);
      localStorage.setItem(LS_DADOS, json);
      toast('Espaço cheio: backups antigos foram descartados');
    } catch(e2){
      console.error(e2);
      alert('Não foi possível salvar no navegador (armazenamento cheio).\n\n'
          + 'Use "Baixar dados.json" no botão de status para não perder as alterações.');
      return;
    }
  }
  pushBackup();
}

function pushBackup(){
  try {
    const arr = JSON.parse(localStorage.getItem(LS_BACKUPS) || '[]');
    arr.unshift({ em: dados.atualizadoEm, json: JSON.stringify(dados) });
    localStorage.setItem(LS_BACKUPS, JSON.stringify(arr.slice(0, MAX_BACKUPS)));
  } catch(e){ /* cota cheia: backups são opcionais */ }
}

/* Rede de segurança: nenhuma resposta pode ficar sem id, senão o card de
   processo correspondente perde a âncora e a narrativa fica órfã. */
function garanteIdsResposta(){
  dados.topicos.forEach(t=>(t.perguntas||[]).forEach(p=>(p.respostas||[]).forEach(r=>{
    if (!r.id) r.id = uid('r');
  })));
}

/** Chamado após QUALQUER alteração. Grava localStorage na hora e agenda o disco. */
function persist(msg){
  garanteIdsResposta();
  saveLocal();
  fileSynced = false;
  if (fileHandle && filePerm === 'granted'){
    clearTimeout(writeTimer);
    writeTimer = setTimeout(writeToDisk, 700);
  }
  renderStatus();
  if (msg) toast(msg);
}

async function writeToDisk(){
  if (!fileHandle) return;
  try {
    filePerm = await fileHandle.queryPermission({ mode:'readwrite' });
    if (filePerm !== 'granted'){ renderStatus(); return; }
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(dados, null, 2));
    await w.close();
    fileSynced = true;
  } catch(e){
    console.error(e);
    fileSynced = false;
  }
  renderStatus();
}

async function connectFile(mode){
  if (!FS_OK){ toast('Navegador não permite gravar arquivo aqui'); return; }
  try {
    let h;
    if (mode === 'novo'){
      h = await window.showSaveFilePicker({
        suggestedName: 'dados.json',
        types:[{ description:'JSON', accept:{ 'application/json':['.json'] } }]
      });
    } else {
      [h] = await window.showOpenFilePicker({
        types:[{ description:'JSON', accept:{ 'application/json':['.json'] } }],
        multiple:false
      });
      const txt = await (await h.getFile()).text();
      const inc = JSON.parse(txt);
      if (!inc || !Array.isArray(inc.dimensoes)) throw new Error('JSON inválido');
      const vazio     = !dados || (!dados.dimensoes.length && !dados.topicos.length && !dados.setores.length);
      const incTime   = Date.parse(inc.atualizadoEm || 0) || 0;
      const localTime = Date.parse(dados && dados.atualizadoEm || 0) || 0;
      // com o app vazio o arquivo sempre vence; senão, vence a versão mais recente
      if (vazio || incTime >= localTime) dados = normalize(inc);
      ui.dadosModal = false; ui.openDimId = null; ui.activeTopicId = null;
      applyTheme();
    }
    filePerm = await h.requestPermission({ mode:'readwrite' });
    if (filePerm !== 'granted'){ toast('Permissão de gravação negada'); return; }
    fileHandle = h;
    await saveHandle(h);
    saveLocal();
    await writeToDisk();
    renderAll();
    toast('Arquivo conectado — salvamento automático ativo');
  } catch(e){
    if (e && e.name === 'AbortError') return;
    console.error(e);
    toast('Não foi possível conectar o arquivo');
  }
}

function downloadJson(){
  const blob = new Blob([JSON.stringify(dados, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dados.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  fileSynced = true; renderStatus();
  toast('dados.json baixado');
}

function importJson(){
  const inp = $('#fileInput');
  inp.value = '';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const inc = JSON.parse(rd.result);
        if (!inc || !Array.isArray(inc.dimensoes)) throw new Error('inválido');
        dados = normalize(inc);
        ui.openDimId = null; ui.activeTopicId = null; ui.dadosModal = false;
        applyTheme(); persist('Dados importados'); renderAll();
      } catch(e){ toast('Arquivo JSON inválido'); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ------------------------------------------------------------- carregamento */
let migrou = false;   // normalize gerou ids que ainda não existem no arquivo

function normalize(d){
  d = d || {};
  return {
    versao: d.versao || 1,
    atualizadoEm: d.atualizadoEm || new Date().toISOString(),
    tema: d.tema === 'dark' ? 'dark' : 'light',
    dimensoes: Array.isArray(d.dimensoes) ? d.dimensoes : [],
    setores:  (Array.isArray(d.setores) ? d.setores : []).map(s=>({
      id: s.id || uid('s'), nome: s.nome || '', coord: s.coord || '',
      func:  s.func  || [],   // 👥 Funcionários
      resp:  s.resp  || [],   // 📋 Responsabilidades
      sist:  s.sist  || [],   // 💻 Sistemas
      main:  s.main  || [],   // 🖥 Mainframe
      tools: s.tools || [],   // 🛠 Ferramentas
      rel:   s.rel   || []    // Setores relacionados (ids)
    })),
    topicos:  (Array.isArray(d.topicos) ? d.topicos : []).map(t=>({
      id: t.id || uid('t'), nome: t.nome || '', dimId: t.dimId || '',
      norm: t.norm || '', setores: t.setores || [], desc: t.desc || '',
      // onde a informação está de fato no normativo — uma ou várias fontes
      fontes: (Array.isArray(t.fontes) ? t.fontes
                : (t.fpag || t.fsec || t.fsecTit ? [{ pag:t.fpag, sec:t.fsec, tit:t.fsecTit }] : []))
              .map(x=>({ pag:(x&&x.pag)||'', sec:(x&&x.sec)||'', tit:(x&&x.tit)||'' }))
              .filter(x=>x.pag || x.sec || x.tit),
      perguntas: (t.perguntas||[]).map(p=>({
        id: p.id || uid('p'), texto: p.texto || '',
        // cada resposta ganha id próprio: é a âncora estável do card de processo
        respostas: (p.respostas||[]).map(r=>{
          if (!r.id) migrou = true;
          return { id: r.id || uid('r'), setorId:r.setorId, texto:r.texto||'' };
        })
      }))
    })),
    // extras do processo, gravados por respId só quando algo é preenchido
    processos: Array.isArray(d.processos) ? d.processos : []
  };
}

async function boot(){
  // 1. localStorage
  let local = null;
  try { local = JSON.parse(localStorage.getItem(LS_DADOS) || 'null'); } catch(e){}

  // 2. arquivo previamente conectado
  let doArquivo = null;
  const h = await loadHandle();
  if (h){
    try {
      fileHandle = h;
      filePerm = await h.queryPermission({ mode:'readwrite' });
      // 'prompt' => o navegador exige um clique do usuário para reautorizar
      if (filePerm === 'granted') doArquivo = JSON.parse(await (await h.getFile()).text());
    } catch(e){ await dropHandle(); fileHandle = null; filePerm = null; }
  }

  // 3. dados.json ao lado do HTML (só funciona via servidor / nem sempre em file://)
  let doFetch = null;
  if (!doArquivo){
    try {
      const r = await fetch('./dados.json', { cache:'no-store' });
      if (r.ok) doFetch = await r.json();
    } catch(e){ /* file:// bloqueia — normal */ }
  }

  // vence o mais recente
  const cand = [local, doArquivo, doFetch].filter(Boolean);
  if (!cand.length){
    dados = normalize({ dimensoes:[], setores:[], topicos:[] });
    applyTheme(); renderAll();
    ui.dadosModal = true; renderModais();
    return;
  }
  cand.sort((a,b)=>(Date.parse(b.atualizadoEm||0)||0)-(Date.parse(a.atualizadoEm||0)||0));
  migrou = false;
  dados = normalize(cand[0]);
  fileSynced = !!doArquivo && doArquivo === cand[0];

  applyTheme(); renderAll();
  // grava de volta os ids de resposta recém-criados, para que os cards de
  // processo continuem ancorados na próxima abertura
  if (migrou) persist();
  else { try { localStorage.setItem(LS_DADOS, JSON.stringify(dados)); } catch(e){} }
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', dados.tema || 'light');
}

/* ------------------------------------------------------------------ render */
function renderAll(){ renderHeader(); renderMain(); renderModais(); renderStatus(); }

function renderHeader(){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  const sel = ui.page === 'setores'  ? '[data-act="goSet"]'
            : ui.page === 'processos'? '[data-act="goProc"]'
            : ui.page === 'mapa'     ? '[data-act="goMapa"]'
            : '[data-act="goDim"]';
  $(sel).classList.add('on');
  const escuro = dados.tema === 'dark';
  const bt = $('#temaBtn');
  bt.innerHTML = escuro ? ico('sol',16) : ico('lua',16);
  bt.title = escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro';
}

function renderStatus(){
  const dot = $('#statusDot'), txt = $('#statusText');
  dot.className = 'dot';
  if (fileHandle && filePerm !== 'granted'){ dot.classList.add('warn'); txt.textContent = 'reautorizar arquivo'; }
  else if (fileHandle && fileSynced)       { dot.classList.add('ok');   txt.textContent = 'dados.json salvo'; }
  else if (fileHandle)                     { dot.classList.add('busy'); txt.textContent = 'gravando arquivo…'; }
  else                                     { dot.classList.add('warn'); txt.textContent = 'só no navegador'; }
}

function renderMain(){
  const m = $('#main');
  if (ui.page === 'setores')        m.innerHTML = viewSetores();
  else if (ui.page === 'processos') m.innerHTML = viewProcessos();
  else if (ui.page === 'mapa')      m.innerHTML = viewMapa();
  else if (ui.openDimId)            m.innerHTML = viewDimensao();
  else                              m.innerHTML = viewDimGrid();
  renderFoco();
  if (ui.page === 'mapa') agendaMapa();
  else if (ui.page === 'setores' || ui.page === 'processos') requestAnimationFrame(equilibraMas);
}

function secaoSetor(s, campo){
  const editando = ui.editCampo && ui.editCampo.setorId===s.id && ui.editCampo.campo===campo.k;
  const auto = campo.tipo === 'auto';
  const cab = `<div class="secHead">
      <span class="kicker" style="font-size:10.5px">${campo.icone?campo.icone+' ':''}${campo.label}</span>
      ${auto
        ? '<span class="autoSelo" title="Preenchido sozinho ao vincular o setor a um tópico">automático</span>'
        : (editando ? '' : `<button class="pen" data-act="editCampo" data-id="${esc(s.id)}" data-campo="${campo.k}" title="Editar">${ico('pen',12)}</button>`)}
    </div>`;

  let corpo;
  if (editando && campo.tipo === 'texto'){
    corpo = `<div class="ansrow">
      <input class="inp" id="edCampo" value="${esc(s[campo.k]||'')}" style="flex:1;min-width:160px;height:34px">
      <button class="primary" data-act="salvaCampo" style="height:34px;padding:0 16px;font-size:12px">Salvar</button>
      <button class="mini" data-act="cancelaCampo">Cancelar</button>
    </div>`;
  } else if (editando && campo.tipo === 'lista'){
    corpo = `<div style="display:flex;flex-direction:column;gap:9px">
      ${tagBox('sec')}
      <span class="dica">Separe por vírgula &mdash; cada item vira uma etiqueta.</span>
      <div class="ansrow">
        <button class="primary" data-act="salvaCampo" style="height:32px;padding:0 16px;font-size:12px">Salvar</button>
        <button class="mini" data-act="cancelaCampo">Cancelar</button>
      </div>
    </div>`;
  } else if (editando && campo.tipo === 'setores'){
    const chips = dados.setores.filter(o=>o.id!==s.id).map(o=>{
      const on = (s.rel||[]).includes(o.id);
      const c = setorTile(o.id);
      return `<button class="chip ${on?'on':''}" data-act="toggleRel" data-id="${esc(s.id)}" data-alvo="${esc(o.id)}"
        ${on?`style="background:${c.bg};color:${c.fg}"`:''}>${esc(o.nome)}</button>`;
    }).join('') || '<span style="font-size:12px;color:var(--text-3)">Nenhum outro setor cadastrado.</span>';
    corpo = `<div style="display:flex;flex-direction:column;gap:8px">
      <div class="tags">${chips}</div>
      <div><button class="mini" data-act="cancelaCampo">Concluir</button></div>
    </div>`;
  } else if (campo.tipo === 'texto'){
    corpo = `<div style="font-size:13px;color:var(--text-2)">${esc(s.coord||'—')}</div>`;
  } else if (campo.tipo === 'setores'){
    const rel = (s.rel||[]).filter(id=>dados.setores.some(x=>x.id===id));
    corpo = rel.length
      ? `<div class="tags">${rel.map(id=>{const c=setorTile(id);
          return `<button class="tag" data-act="irSetor" data-id="${esc(id)}" style="background:${c.bg};color:${c.fg};border:none">${esc(setorNome(id))}</button>`;}).join('')}</div>`
      : vazioTxt();
  } else if (campo.k === 'tops'){
    const tops = topicosDoSetor(s.id);
    corpo = tops.length
      ? `<div class="tags">${tops.map(t=>`<button class="gitem" data-act="irTopico" data-id="${esc(t.id)}" style="cursor:pointer">${esc(t.nome)}</button>`).join('')}</div>`
      : vazioTxt('Vincule este setor a um tópico para preencher.');
  } else if (campo.k === 'dims'){
    const ds = dimensoesDoSetor(s.id);
    corpo = ds.length
      ? `<div class="tags">${ds.map(d=>{const c=dimTile(d.id);
          return `<button class="tag" data-act="irDim" data-id="${esc(d.id)}" style="background:${c.bg};color:${c.fg};border:none">${esc(d.id)} — ${esc(d.nome)}</button>`;}).join('')}</div>`
      : vazioTxt('Derivado dos tópicos acima.');
  } else {
    const it = s[campo.k] || [];
    corpo = it.length
      ? `<div class="tags">${it.map(x=>`<span class="gitem">${esc(x)}</span>`).join('')}</div>`
      : vazioTxt();
  }
  return `<div class="sec">${cab}${corpo}</div>`;
}

/* Código do normativo + a fonte exata: página, seção e título da seção. */
function blocoFonte(t){
  const fs = t.fontes || [];
  if (!t.norm && !fs.length) return '';
  const linhas = fs.length
    ? fs.map(f=>{
        const bits = [];
        if (f.pag) bits.push('<span class="fonteItem"><span class="fonteRot">Pág.</span>'+esc(f.pag)+'</span>');
        if (f.sec) bits.push('<span class="fonteItem"><span class="fonteRot">Seção</span>'+esc(f.sec)+'</span>');
        return `<div class="fonteRow">
          <div class="fonteLinha">${bits.join('<span class="procSep">·</span>') || '<span class="dica">Página e seção não informadas.</span>'}</div>
          ${f.tit ? `<div class="fonteTit">${esc(f.tit)}</div>` : ''}
        </div>`;
      }).join('')
    : '<div class="fonteRow"><span class="dica">Fonte ainda não detalhada.</span></div>';
  return `<div class="fonte">
    <div class="fonteTopo">
      <span class="fonteCod">${esc(t.norm || 'sem normativo')}</span>
      <span class="kicker" style="font-size:10px">${fs.length > 1 ? fs.length+' fontes oficiais' : 'Fonte oficial'}</span>
    </div>
    <div class="fonteLista">${linhas}</div>
  </div>`;
}

/* Monta os grupos conforme o eixo escolhido, preservando a ordem canônica
   (as dimensões na ordem I..XII, os setores na ordem de cadastro). */
function gruposProcesso(lista, modo){
  const grupos = [];
  if (modo === 'setor'){
    dados.setores.forEach(s=>{
      const itens = lista.filter(pr=>pr.setorId===s.id);
      if (itens.length) grupos.push({ nome:s.nome, cor:setorTile(s.id).fg, itens });
    });
    const orfaos = lista.filter(pr=>!dados.setores.some(s=>s.id===pr.setorId));
    if (orfaos.length) grupos.push({ nome:'Setor removido', cor:'var(--text-3)', itens:orfaos });
  } else {
    dados.dimensoes.forEach(d=>{
      const itens = lista.filter(pr=>pr.topico.dimId===d.id);
      if (itens.length) grupos.push({ nome:`${d.id} · ${d.nome}`, cor:dimTile(d.id).fg, itens });
    });
    const orfaos = lista.filter(pr=>!dados.dimensoes.some(d=>d.id===pr.topico.dimId));
    if (orfaos.length) grupos.push({ nome:'Sem dimensão', cor:'var(--text-3)', itens:orfaos });
  }
  return grupos;
}

function viewProcessos(){
  const todos = listaProcessos();

  const comNarrativa = todos.filter(pr=>pr.extra && (pr.extra.narrativa||'').trim()).length;

  const corpo = !lista.length

    : gruposProcesso(lista, modo).map(g=>`
        <section class="grupo">

  return `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 26px 2px;flex-wrap:wrap">
      <div>
        <h1>Processos</h1>

/* ------------------------------------------------------------------ mapa */
/* Dimensão é o pivô: ramifica em setores e, dentro de cada setor, nos tópicos
   daquela dimensão. Cada botão abre e, no mesmo clique, recolhe o ramo. */
function mapaSetores(dimId){
  const tops = dados.topicos.filter(t=>t.dimId===dimId);
  return dados.setores
    .map(s=>({ s, tops: tops.filter(t=>(t.setores||[]).includes(s.id)) }))
    .filter(x=>x.tops.length);
}

/* "RH e Comercial", "RH, Comercial e Jurídico" */
function listaPt(arr){
  if (arr.length === 1) return arr[0];
  return arr.slice(0,-1).join(', ') + ' e ' + arr[arr.length-1];
}

function viewMapa(){
  let seq = 0;
  const nid = () => 'n' + (++seq);

  const ramos = dados.dimensoes.map(d=>{
    const sets = mapaSetores(d.id);
    // um mesmo tópico pode ser respondido por vários setores: registra onde aparece
    const onde = {};
    sets.forEach(({s, tops})=>tops.forEach(t=>{ (onde[t.id] = onde[t.id] || []).push(s.nome); }));
    const nTop = dados.topicos.filter(t=>t.dimId===d.id).length;
    const c    = dimTile(d.id);
    const k    = 'dim:' + d.id;
    const ab   = !!ui.mapaAberto[k] && sets.length > 0;
    const id   = nid();

    const filhos = !ab ? '' : sets.map(({s, tops})=>{
      const sk  = 'set:' + d.id + '|' + s.id;
      const sab = !!ui.mapaAberto[sk];
      const sc  = setorTile(s.id);
      const sid = nid();
      const tramos = !sab ? '' : tops.map(t=>{
        const outros = (onde[t.id]||[]).filter(n=>n!==s.nome);
        const selo = outros.length
          ? `<span class="dupSelo tip" data-tip="Mesmo tópico em ${esc(listaPt(outros))}" title="Mesmo tópico em ${esc(listaPt(outros))}">${ico('copia',10)}${outros.length+1}×</span>`
          : '';
        return `<div class="ramo"><div class="noLinha">
          <button class="no topico${outros.length?' dup':''}" data-act="verTopico" data-id="${esc(t.id)}" title="Ver as informações deste tópico">${esc(t.nome)}${t.norm?`<small>${esc(t.norm)}</small>`:''}</button>
          ${selo}
        </div></div>`;
      }).join('');
      return `<div class="ramo">
        <div class="noLinha">
          <button class="no" data-act="mapaTog" data-key="${esc(sk)}" style="box-shadow:inset 3px 0 0 0 ${sc.fg}">${esc(s.nome)}<small>${tops.length} tópico${tops.length===1?'':'s'}</small></button>
          <button class="noBtn ${sab?'on':''}" data-act="mapaTog" data-key="${esc(sk)}" data-nid="${sid}" title="${sab?'Recolher':'Expandir'}">${ico('chev',12)}</button>
        </div>
        ${sab ? `<div class="filhos" data-parent="${sid}">${tramos}</div>` : ''}
      </div>`;
    }).join('');

    return `<div class="ramo ${sets.length?'':'mapaVazio'}">
      <div class="noLinha">
        <button class="no raiz" data-act="mapaTog" data-key="${esc(k)}" style="background:${c.bg};color:${c.fg};border-color:transparent">${esc(d.id)} — ${esc(d.nome)}<small style="color:${c.fg};opacity:.75">${nTop} tópico${nTop===1?'':'s'}</small></button>
        ${sets.length ? `<button class="noBtn ${ab?'on':''}" data-act="mapaTog" data-key="${esc(k)}" data-nid="${id}" title="${ab?'Recolher':'Expandir'}">${ico('chev',12)}</button>` : ''}
      </div>
      ${ab ? `<div class="filhos" data-parent="${id}">${filhos}</div>` : ''}
    </div>`;
  }).join('');

  return `<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 26px 2px;flex-wrap:wrap">
      <div>
        <h1>Mapa</h1>
        <p class="sub">Cada dimensão ramifica nos setores que a respondem e, dentro deles, nos tópicos. Clique no botão do nó para abrir — e no mesmo botão para recolher.</p>
        <p class="sub" style="display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12.5px"><span class="dupSelo">${ico('copia',10)}2×</span> o mesmo tópico é respondido por mais de um setor — passe o mouse para ver quais.</p>
      </div>
      <div class="tags">
        <button class="ghost" data-act="mapaTudo" data-modo="abrir" style="background:var(--surface)">Expandir tudo</button>
        <button class="ghost" data-act="mapaTudo" data-modo="fechar" style="background:var(--surface)">Recolher tudo</button>
      </div>
    </div>
    <div class="mapaWrap" id="mapaWrap">
      <svg class="mapaSvg" id="mapaSvg"></svg>
      <div class="arvore">${ramos || '<div class="empty">Nenhuma dimensão carregada.</div>'}</div>
    </div>`;
}

/* As ligações são desenhadas depois do layout: saída no botão do nó pai,
   chegada na borda esquerda de cada filho. */
/* o layout precisa estar pronto (e as fontes carregadas) antes de medir */
function agendaMapa(){
  requestAnimationFrame(desenhaMapa);
  setTimeout(desenhaMapa, 140);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(desenhaMapa);
}

function desenhaMapa(){
  const wrap = $('#mapaWrap'), svg = $('#mapaSvg');
  if (!wrap || !svg) return;
  const W = wrap.getBoundingClientRect();
  svg.setAttribute('width', W.width);
  svg.setAttribute('height', W.height);
  svg.setAttribute('viewBox', `0 0 ${W.width} ${W.height}`);
  let d = '';
  wrap.querySelectorAll('[data-parent]').forEach(box=>{
    const bt = wrap.querySelector(`.noBtn[data-nid="${box.dataset.parent}"]`);
    if (!bt) return;
    const b  = bt.getBoundingClientRect();
    const x1 = b.right - W.left, y1 = b.top + b.height/2 - W.top;
    [...box.children].forEach(ramo=>{
      const no = ramo.querySelector('.no');
      if (!no) return;
      const r  = no.getBoundingClientRect();
      const x2 = r.left - W.left, y2 = r.top + r.height/2 - W.top;
      const mx = x1 + (x2 - x1) * .55;
      d += `M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2} `;
    });
  });
  svg.innerHTML = d ? `<path d="${d}" style="fill:none;stroke:var(--accent);stroke-opacity:.55;stroke-width:1.6"/>` : '';
}

      <div class="tile" style="width:46px;height:46px;border-radius:14px;background:${c.bg};color:${c.fg};font-size:16px">${esc((t.nome||'?').charAt(0).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="kicker">Dimensão ${esc(t.dimId)} &middot; ${esc(d?d.nome:'')}</div>

      </div>

      <p class="desc" style="font-size:14.5px">${esc(t.desc||'Sem descrição.')}</p>

    <div style="padding:20px 24px 24px;display:flex;flex-direction:column;gap:11px">
      <div class="kicker" style="font-size:10.5px">Roteiro de perguntas e respostas</div>

/* ------------------------------------------------------------------- foco */
function renderFoco(){
  const cont = $('#foco');
  if (!cont) return;
  const f = ui.foco;
  if (!f){ cont.innerHTML = ''; return; }
  let card = '', rot = '', larga = '';
  if (f.tipo === 'topico'){
    const t = getTopico(f.id);
    if (!t){ ui.foco = null; cont.innerHTML = ''; return; }
    rot = `${ico('olho',13)} Tópico em foco <span class="autoSelo">somente leitura</span>`;
    larga = 'max-width:740px';
    card = painelTopico(t);
  } else if (f.tipo === 'setor'){
    const i = setorIdx(f.id), s = dados.setores[i];
    if (!s){ ui.foco = null; cont.innerHTML = ''; return; }
    rot = 'Setor em foco'; card = cardSetor(s, i, true);
  } else {
    const pr = listaProcessos().find(x=>x.respId===f.id);
    if (!pr){ ui.foco = null; cont.innerHTML = ''; return; }
    rot = 'Processo em foco';
    card = cardProcesso(pr, ui.grupoProc === 'setor' ? 'setor' : 'dim', true);
  }
  cont.innerHTML = `<div class="overlay foco" data-act="fecharFoco">
    <div class="focoBox" data-stop style="${larga}">
      <div class="focoBar">
        <span class="focoRot">${rot}</span>
        <button class="x" data-act="fecharFoco" title="Sair do foco (Esc)">${ico('x',13)}</button>
      </div>
      ${card}
    </div>
  </div>`;
}

/* ------------------------------------------------------------------ modais */
/* Recria o HTML dos modais preservando a rolagem — sem isso, adicionar uma
   pergunta ou resposta joga a modal de volta ao topo e parece que ela fechou. */
function renderModais(){
  const cont = $('#modais');
  const antes = [...cont.querySelectorAll('.overlay')].map(o=>o.scrollTop);

  const parts = [];
  if (ui.activeTopicId) parts.push(modalTopico());
  if (ui.topicForm)     parts.push(modalTopicForm());
  if (ui.setorForm)     parts.push(modalSetorForm());
  if (ui.dadosModal)    parts.push(modalDados());
  cont.innerHTML = parts.join('');

  cont.querySelectorAll('.overlay').forEach((o,i)=>{ if (antes[i]) o.scrollTop = antes[i]; });
}

function chipsRelHtml(selfId, sel){

  return outros.map(s=>{
    const on = (sel||[]).includes(s.id);
    const c = setorTile(s.id);
    return `<button class="chip ${on?'on':''}" data-act="chipRel" data-id="${esc(s.id)}"
      ${on?`style="background:${c.bg};color:${c.fg}"`:''}>${esc(s.nome)}</button>`;
  }).join('');
}

function modalDados(){
  let bk = [];
  try { bk = JSON.parse(localStorage.getItem(LS_BACKUPS) || '[]'); } catch(e){}
  const bkHtml = bk.map((b,i)=>`<div style="display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:12.5px;color:var(--text-2)">${new Date(b.em).toLocaleString('pt-BR')}</span>
      <button class="mini" data-act="restore" data-i="${i}">Restaurar</button>
    </div>`).join('') || '<div style="font-size:12.5px;color:var(--text-3)">Nenhum backup ainda.</div>';

  const vazio = !dados.dimensoes.length && !dados.topicos.length && !dados.setores.length;

  let estado;
  if (vazio)
    estado = `<p class="note">Bem-vinda! Nada foi carregado ainda porque o navegador bloqueia a leitura automática de arquivos vizinhos quando o HTML é aberto por duplo clique.<br><br>
      Clique em <b>Conectar dados.json</b> e escolha o arquivo <span class="mono">dados.json</span> que está na mesma pasta deste HTML. Isso só é preciso uma vez: a partir daí tudo é salvo sozinho, no navegador e no próprio arquivo.</p>`;
  else if (fileHandle && filePerm !== 'granted')
    estado = `<p class="note" style="color:var(--warn)">O <span class="mono">dados.json</span> já foi conectado antes, mas o navegador exige um clique para reautorizar a gravação nesta sessão.</p>
      <button class="primary" data-act="reautorizar">Reautorizar gravação</button>`;
  else if (fileHandle)
    estado = `<p class="note">Arquivo conectado. Toda alteração é gravada automaticamente no <span class="mono">dados.json</span> escolhido${fileSynced?' (em dia).':' — gravação pendente.'}</p>`;
  else
    estado = `<p class="note">As alterações estão sendo salvas <b>no navegador (localStorage)</b>. Conecte o <span class="mono">dados.json</span> abaixo para que o arquivo também seja gravado sozinho a cada mudança.</p>`;

  const fsWarn = FS_OK ? '' :
    `<p class="note" style="color:var(--warn)">Este navegador (ou o modo de abertura do arquivo) não permite gravação direta em disco. Use <b>Baixar dados.json</b> para atualizar o arquivo manualmente, ou abra o HTML pelo Chrome/Edge.</p>`;

  return `<div class="overlay" style="z-index:400" ${vazio?'':'data-act="closeDados"'}>
    <div class="modal sm" data-stop>
      <div class="mhead" style="align-items:center;justify-content:space-between">
        <h2 style="font-size:19px;font-weight:800;letter-spacing:-.02em">${vazio?'Carregar dados':'Dados e backup'}</h2>
        ${vazio?'':'<button class="x" data-act="closeDados" title="Fechar">'+ico('x',13)+'</button>'}
      </div>
      <div style="padding:22px 26px;display:flex;flex-direction:column;gap:18px">
        ${estado}${fsWarn}
        <div class="tags">
          <button class="primary" data-act="conectar">Conectar dados.json</button>
          <button class="ghost" data-act="importar" style="background:var(--surface)">Importar JSON (sem gravação automática)</button>
          ${vazio?'':`<button class="ghost" data-act="criarArquivo" style="background:var(--surface)">Criar novo arquivo</button>
          <button class="ghost" data-act="baixar" style="background:var(--surface)">Baixar dados.json</button>`}
        </div>
        ${vazio?'':`<div>
          <div class="kicker" style="margin-bottom:8px">Backups automáticos (últimos ${MAX_BACKUPS})</div>
          ${bkHtml}
        </div>
